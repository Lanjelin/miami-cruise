# Miami Cruise for tmux 3.4+. Generated by build.py; edit themes/tmux.py.
# Variant: dark. Source after other theme/plugin colour settings.
# Colours only. Existing formats, separators, attributes and bindings stay intact.
# Inline #[fg=...,bg=...] and local session/window overrides take precedence.
# Pane contents and terminal capabilities are deliberately not configured.

set-option -ag status-style "fg=#deebec,bg=#04161a"
set-option -ag status-left-style "fg=#deebec,bg=#04161a"
set-option -ag status-right-style "fg=#9fbabf,bg=#04161a"
set-option -agw window-status-style "fg=#9fbabf,bg=#04161a"
set-option -agw window-status-current-style "fg=#04161a,bg=#ff7fc0"
set-option -agw window-status-activity-style "fg=#70d5ed,bg=#0d1d22"
set-option -agw window-status-bell-style "fg=#fd717c,bg=#0d1d22"
set-option -agw window-status-last-style "fg=#deebec,bg=#04161a"
set-option -agw pane-border-style "fg=#6a8d94"
set-option -agw pane-active-border-style "fg=#ff7fc0"
set-option -ag message-style "fg=#deebec,bg=#04161a"
set-option -ag message-command-style "fg=#04161a,bg=#ff7fc0"
set-option -agw mode-style "fg=#04161a,bg=#ff7fc0"
set-option -ag menu-style "fg=#deebec,bg=#04161a"
set-option -ag menu-selected-style "fg=#04161a,bg=#ff7fc0"
set-option -ag menu-border-style "fg=#ff7fc0,bg=#0d1d22"
set-option -agw popup-style "fg=#deebec,bg=#0d1d22"
set-option -agw popup-border-style "fg=#ff7fc0,bg=#0d1d22"
set-option -g display-panes-colour "#70d5ed"
set-option -g display-panes-active-colour "#ff7fc0"
set-option -gw clock-mode-colour "#ff7fc0"
