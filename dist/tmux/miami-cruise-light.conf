# Miami Cruise for tmux 3.4+. Generated by build.py; edit themes/tmux.py.
# Variant: light. Source after other theme/plugin colour settings.
# Colours only. Existing formats, separators, attributes and bindings stay intact.
# Inline #[fg=...,bg=...] and local session/window overrides take precedence.
# Pane contents and terminal capabilities are deliberately not configured.

set-option -ag status-style "fg=#142a30,bg=#e4eff1"
set-option -ag status-left-style "fg=#142a30,bg=#e4eff1"
set-option -ag status-right-style "fg=#3a5157,bg=#e4eff1"
set-option -agw window-status-style "fg=#3a5157,bg=#e4eff1"
set-option -agw window-status-current-style "fg=#f1f8f9,bg=#b51c79"
set-option -agw window-status-activity-style "fg=#007c91,bg=#f1f8f9"
set-option -agw window-status-bell-style "fg=#c8414c,bg=#f1f8f9"
set-option -agw window-status-last-style "fg=#142a30,bg=#e4eff1"
set-option -agw pane-border-style "fg=#566e74"
set-option -agw pane-active-border-style "fg=#b51c79"
set-option -ag message-style "fg=#142a30,bg=#e4eff1"
set-option -ag message-command-style "fg=#f1f8f9,bg=#b51c79"
set-option -agw mode-style "fg=#f1f8f9,bg=#b51c79"
set-option -ag menu-style "fg=#142a30,bg=#e4eff1"
set-option -ag menu-selected-style "fg=#f1f8f9,bg=#b51c79"
set-option -ag menu-border-style "fg=#b51c79,bg=#f1f8f9"
set-option -agw popup-style "fg=#142a30,bg=#f1f8f9"
set-option -agw popup-border-style "fg=#b51c79,bg=#f1f8f9"
set-option -g display-panes-colour "#007c91"
set-option -g display-panes-active-colour "#b51c79"
set-option -gw clock-mode-colour "#b51c79"
