# Miami Cruise for Yazi. Generated by build.py; edit themes/yazi.py.
# Variant: light. Install as a Yazi flavor, not as theme.toml.
# Only appearance is changed; terminal background and icon glyphs are untouched.

[mgr]
cwd = { fg = "#b51c79", bold = true }
find_keyword = { fg = "#f1f8f9", bg = "#b51c79", bold = true }
find_position = { fg = "#007c91", bold = true }
symlink_target = { fg = "#3a5157" }
marker_copied = { fg = "#008254", bg = "#008254" }
marker_cut = { fg = "#c8414c", bg = "#c8414c" }
marker_marked = { fg = "#007c91", bg = "#007c91" }
marker_selected = { fg = "#b51c79", bg = "#b51c79" }
count_copied = { fg = "#f1f8f9", bg = "#008254", bold = true }
count_cut = { fg = "#f1f8f9", bg = "#c8414c", bold = true }
count_selected = { fg = "#f1f8f9", bg = "#b51c79", bold = true }
border_style = { fg = "#c9dcde" }

[indicator]
parent = { fg = "#3a5157", bg = "#dfecee" }
current = { fg = "#f1f8f9", bg = "#b51c79", bold = true }
preview = { fg = "#007c91" }

[tabs]
active = { fg = "#f1f8f9", bg = "#b51c79", bold = true }
inactive = { fg = "#3a5157", bg = "#e4eff1" }

[mode]
normal_main = { fg = "#f1f8f9", bg = "#b51c79", bold = true }
normal_alt = { fg = "#142a30", bg = "#e4eff1" }
select_main = { fg = "#f1f8f9", bg = "#007c91", bold = true }
select_alt = { fg = "#007c91" }
unset_main = { fg = "#f1f8f9", bg = "#906b00", bold = true }
unset_alt = { fg = "#906b00" }

[status]
overall = { fg = "#142a30" }
perm_sep = { fg = "#3a5157" }
perm_type = { fg = "#007c91" }
perm_read = { fg = "#008254" }
perm_write = { fg = "#906b00" }
perm_exec = { fg = "#b51c79" }
progress_label = { fg = "#142a30", bold = true }
progress_normal = { fg = "#f1f8f9", bg = "#b51c79" }
progress_error = { fg = "#f1f8f9", bg = "#c8414c" }

[which]
border = { fg = "#b51c79" }
mask = { fg = "#3a5157" }
cand = { fg = "#b51c79" }
rest = { fg = "#3a5157" }
desc = { fg = "#007c91" }
separator_style = { fg = "#c9dcde" }

[confirm]
border = { fg = "#b51c79" }
title = { fg = "#b51c79", bold = true }
body = { fg = "#142a30" }
list = { fg = "#142a30" }
btn_yes = { fg = "#f1f8f9", bg = "#b51c79", bold = true }
btn_no = { fg = "#142a30", bg = "#dfecee" }

[spot]
border = { fg = "#b51c79" }
title = { fg = "#b51c79", bold = true }
tbl_col = { fg = "#007c91" }
tbl_cell = { fg = "#f1f8f9", bg = "#b51c79" }

[notify]
title_info = { fg = "#007c91" }
title_warn = { fg = "#906b00" }
title_error = { fg = "#c8414c" }

[pick]
border = { fg = "#b51c79" }
active = { fg = "#f1f8f9", bg = "#b51c79", bold = true }
inactive = { fg = "#3a5157" }

[input]
border = { fg = "#b51c79" }
title = { fg = "#b51c79", bold = true }
value = { fg = "#142a30" }
selected = { fg = "#f1f8f9", bg = "#b51c79" }

[cmp]
border = { fg = "#b51c79" }
active = { fg = "#f1f8f9", bg = "#b51c79", bold = true }
inactive = { fg = "#142a30" }

[tasks]
border = { fg = "#b51c79" }
title = { fg = "#b51c79", bold = true }
hovered = { fg = "#f1f8f9", bg = "#b51c79", bold = true }

[help]
border = { fg = "#b51c79" }
chord = { fg = "#007c91" }
action = { fg = "#142a30" }
hovered = { fg = "#f1f8f9", bg = "#b51c79", bold = true }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#935ba0" },
  { mime = "**/{audio,video}/*", fg = "#007c91" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#b35713" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#142a30" },
  { mime = "vfs/{absent,stale}", fg = "#566e74" },
  { url = "*", is = "orphan", fg = "#c8414c", bold = true },
  { url = "*", is = "exec", fg = "#008254" },
  { url = "*/", fg = "#007c91" },
  { url = "*", fg = "#142a30" },
]
