# Miami Cruise for Yazi. Generated by build.py; edit themes/yazi.py.
# Variant: dark. Install as a Yazi flavor, not as theme.toml.
# Only appearance is changed; terminal background and icon glyphs are untouched.

[mgr]
cwd = { fg = "#ff7fc0", bold = true }
find_keyword = { fg = "#04161a", bg = "#ff7fc0", bold = true }
find_position = { fg = "#70d5ed", bold = true }
symlink_target = { fg = "#9fbabf" }
marker_copied = { fg = "#5ed99e", bg = "#5ed99e" }
marker_cut = { fg = "#fd717c", bg = "#fd717c" }
marker_marked = { fg = "#70d5ed", bg = "#70d5ed" }
marker_selected = { fg = "#ff7fc0", bg = "#ff7fc0" }
count_copied = { fg = "#0d1d22", bg = "#5ed99e", bold = true }
count_cut = { fg = "#0d1d22", bg = "#fd717c", bold = true }
count_selected = { fg = "#04161a", bg = "#ff7fc0", bold = true }
border_style = { fg = "#253c42" }

[indicator]
parent = { fg = "#9fbabf", bg = "#182c32" }
current = { fg = "#04161a", bg = "#ff7fc0", bold = true }
preview = { fg = "#70d5ed" }

[tabs]
active = { fg = "#04161a", bg = "#ff7fc0", bold = true }
inactive = { fg = "#9fbabf", bg = "#04161a" }

[mode]
normal_main = { fg = "#04161a", bg = "#ff7fc0", bold = true }
normal_alt = { fg = "#deebec", bg = "#04161a" }
select_main = { fg = "#0d1d22", bg = "#70d5ed", bold = true }
select_alt = { fg = "#70d5ed" }
unset_main = { fg = "#0d1d22", bg = "#ecd065", bold = true }
unset_alt = { fg = "#ecd065" }

[status]
overall = { fg = "#deebec" }
perm_sep = { fg = "#9fbabf" }
perm_type = { fg = "#70d5ed" }
perm_read = { fg = "#5ed99e" }
perm_write = { fg = "#ecd065" }
perm_exec = { fg = "#ff7fc0" }
progress_label = { fg = "#deebec", bold = true }
progress_normal = { fg = "#04161a", bg = "#ff7fc0" }
progress_error = { fg = "#0d1d22", bg = "#fd717c" }

[which]
border = { fg = "#ff7fc0" }
mask = { fg = "#9fbabf" }
cand = { fg = "#ff7fc0" }
rest = { fg = "#9fbabf" }
desc = { fg = "#70d5ed" }
separator_style = { fg = "#253c42" }

[confirm]
border = { fg = "#ff7fc0" }
title = { fg = "#ff7fc0", bold = true }
body = { fg = "#deebec" }
list = { fg = "#deebec" }
btn_yes = { fg = "#04161a", bg = "#ff7fc0", bold = true }
btn_no = { fg = "#deebec", bg = "#182c32" }

[spot]
border = { fg = "#ff7fc0" }
title = { fg = "#ff7fc0", bold = true }
tbl_col = { fg = "#70d5ed" }
tbl_cell = { fg = "#04161a", bg = "#ff7fc0" }

[notify]
title_info = { fg = "#70d5ed" }
title_warn = { fg = "#ecd065" }
title_error = { fg = "#fd717c" }

[pick]
border = { fg = "#ff7fc0" }
active = { fg = "#04161a", bg = "#ff7fc0", bold = true }
inactive = { fg = "#9fbabf" }

[input]
border = { fg = "#ff7fc0" }
title = { fg = "#ff7fc0", bold = true }
value = { fg = "#deebec" }
selected = { fg = "#04161a", bg = "#ff7fc0" }

[cmp]
border = { fg = "#ff7fc0" }
active = { fg = "#04161a", bg = "#ff7fc0", bold = true }
inactive = { fg = "#deebec" }

[tasks]
border = { fg = "#ff7fc0" }
title = { fg = "#ff7fc0", bold = true }
hovered = { fg = "#04161a", bg = "#ff7fc0", bold = true }

[help]
border = { fg = "#ff7fc0" }
chord = { fg = "#70d5ed" }
action = { fg = "#deebec" }
hovered = { fg = "#04161a", bg = "#ff7fc0", bold = true }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#d7a0e3" },
  { mime = "**/{audio,video}/*", fg = "#70d5ed" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#fb9d59" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#deebec" },
  { mime = "vfs/{absent,stale}", fg = "#6a8d94" },
  { url = "*", is = "orphan", fg = "#fd717c", bold = true },
  { url = "*", is = "exec", fg = "#5ed99e" },
  { url = "*/", fg = "#70d5ed" },
  { url = "*", fg = "#deebec" },
]
