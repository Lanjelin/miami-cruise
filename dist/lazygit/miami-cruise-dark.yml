# Miami Cruise for lazygit. Generated by build.py; edit themes/lazygit.py.
# Merge as a separate config layer; this file changes appearance only.
gui:
  colorScheme: "dark"
  theme:
    activeBorderColor: ["#ff7fc0", "bold"]
    inactiveBorderColor: ["#6a8d94"]
    searchingActiveBorderColor: ["#70d5ed", "bold"]
    optionsTextColor: ["#70d5ed"]
    selectedLineFgColor: ["#deebec", "bold"]
    selectedLineBgColor: ["#182c32"]
    inactiveViewSelectedLineBgColor: ["#0d1d22"]
    cherryPickedCommitFgColor: ["#04161a"]
    cherryPickedCommitBgColor: ["#ff7fc0"]
    markedBaseCommitFgColor: ["#0d1d22"]
    markedBaseCommitBgColor: ["#ecd065"]
    unstagedChangesColor: ["#fd717c"]
    defaultFgColor: ["#deebec"]
    authorColors:
      "*": "#d7a0e3"
  darkTheme:
    activeBorderColor: ["#ff7fc0", "bold"]
    inactiveBorderColor: ["#6a8d94"]
    searchingActiveBorderColor: ["#70d5ed", "bold"]
    optionsTextColor: ["#70d5ed"]
    selectedLineFgColor: ["#deebec", "bold"]
    selectedLineBgColor: ["#182c32"]
    inactiveViewSelectedLineBgColor: ["#0d1d22"]
    cherryPickedCommitFgColor: ["#04161a"]
    cherryPickedCommitBgColor: ["#ff7fc0"]
    markedBaseCommitFgColor: ["#0d1d22"]
    markedBaseCommitBgColor: ["#ecd065"]
    unstagedChangesColor: ["#fd717c"]
    defaultFgColor: ["#deebec"]
    authorColors:
      "*": "#d7a0e3"
