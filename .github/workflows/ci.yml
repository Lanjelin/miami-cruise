# Builds everything on every push and pull request, and fails if the generated files are stale.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build themes, docs and the website
        run: python3 -I build.py

      - name: Generated files must match a fresh build
        run: |
          # dist/ (new or changed files), docs/SPEC.md and the README apps table are all written by the build
          if [ -n "$(git status --porcelain -- dist docs/SPEC.md README.md)" ]; then
            echo "::error::Generated files are out of date. Run 'python3 -I build.py' and commit the result."
            git status --short -- dist docs/SPEC.md README.md
            git diff --stat -- docs/SPEC.md README.md
            exit 1
          fi
