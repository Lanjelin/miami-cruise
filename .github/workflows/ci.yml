# Builds everything on every push and pull request, and fails if the generated files are stale.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build themes, brand assets and the website
        run: python3 -I build.py

      - name: dist/ must match a fresh build
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ is out of date. Run 'python3 -I build.py' and commit the result."
            git status --short -- dist
            exit 1
          fi

      - name: docs/SPEC.md must match the palette
        run: |
          python3 -I docs/gen_spec.py
          if ! git diff --quiet -- docs/SPEC.md; then
            echo "::error::docs/SPEC.md is out of date. Run 'python3 -I docs/gen_spec.py' and commit the result."
            exit 1
          fi
