name: Bug report
description: A colour looks wrong, a highlight group is missing, or a theme fails to load.
labels: [bug]
body:
  - type: input
    id: app
    attributes:
      label: App
      description: Which theme is affected (for example Neovim, WezTerm, Web / CSS, or the website).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: For example the output of `nvim --version`, `vim --version` or `wezterm --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and terminal
      placeholder: macOS 15, Windows 11, Ubuntu 24.04, ...
    validations:
      required: true
  - type: dropdown
    id: variant
    attributes:
      label: Variant
      options: [Dark, Light, Both, Switching between them]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: What you expected and what you see. For a colour problem, name the element (for example "Telescope selection" or "git diff added line").
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or sample
      description: Drag an image here, or paste a short sample that shows the problem.
